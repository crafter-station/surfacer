name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      # A tag that disagrees with Cargo.toml ships binaries reporting the wrong
      # version, and nothing downstream would catch it.
      - name: Check the tag matches the crate version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          CRATE=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "$TAG" != "v$CRATE" ]; then
            echo "tag $TAG does not match workspace version $CRATE" >&2
            exit 1
          fi

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p surfacer

      - name: Package
        run: |
          mkdir -p dist
          tar -czf "dist/surfacer-${{ matrix.target }}.tar.gz" \
            -C "target/${{ matrix.target }}/release" surfacer
          # shasum is macOS, sha256sum is GNU. Runners differ, so pick one.
          if command -v sha256sum >/dev/null; then
            SUM=sha256sum
          else
            SUM="shasum -a 256"
          fi
          cd dist
          $SUM "surfacer-${{ matrix.target }}.tar.gz" \
            > "surfacer-${{ matrix.target }}.tar.gz.sha256"

      - name: Verify the archive runs
        if: matrix.target == 'aarch64-apple-darwin' || matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          tar -xzf "dist/surfacer-${{ matrix.target }}.tar.gz" -C /tmp
          /tmp/surfacer --help > /dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: surfacer-${{ matrix.target }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            artifacts/*
